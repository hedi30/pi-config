name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate configuration and scan for secrets
        run: ./validate.sh
      - name: Exercise installer in dry-run mode
        run: ./install.sh --dry-run --skip-cli --skip-packages
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
